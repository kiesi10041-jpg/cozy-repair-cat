<!doctype html><html><meta charset="utf-8"><title>시간대 조명 검수</title><style>body{background:#211d25;color:#fff;font:18px system-ui;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px}canvas{width:100%;image-rendering:pixelated}h2{font-size:18px}</style><div><h2>09:00 · 낮</h2><canvas id="day" width="1024" height="684"></canvas></div><div><h2>20:00 · 실내 조명</h2><canvas id="night" width="1024" height="684"></canvas></div><script src="../assets/scene-assets.js"></script><script src="../src/lighting.js"></script><script>const room=new Image();room.onload=()=>{for(const[id,t]of[['day',9],['night',20]]){const c=document.getElementById(id).getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(room,0,0,1024,684);ShopLighting.paint(c,t)}};room.src=GAME_ASSETS.room;</script></html>
